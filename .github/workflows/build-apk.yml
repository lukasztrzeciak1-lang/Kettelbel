name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare stable APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Kettlebell-Training.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kettlebell220-APK
          path: Kettlebell-Training.apk
          if-no-files-found: error

      - name: Publish stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Kettlebell-Training.apk --clobber
          else
            gh release create latest Kettlebell-Training.apk \
              --title "Kettlebell Training – najnowsza" \
              --notes "Najnowsza automatycznie zbudowana wersja aplikacji Android. Ten sam link zawsze prowadzi do aktualnego APK."
          fi
