<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kettlebell 220 Coach</title>
<style>
:root{--bg:#07111f;--card:#101827;--soft:#1b2638;--text:#f8fafc;--muted:#94a3b8;--accent:#facc15;--ok:#22c55e;--danger:#ef4444;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0f172a,#020617);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:12px 12px 88px}.card{background:rgba(16,24,39,.96);border:1px solid #263449;border-radius:16px;padding:14px;margin-bottom:12px}
h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.goal{color:var(--accent);font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #344155;background:#0b1220;color:#fff;margin-top:5px}
button{border:0;border-radius:12px;padding:13px 15px;font-weight:800;cursor:pointer}.btn{background:var(--accent);color:#111827}.ok{background:var(--ok)}.secondary{background:#334155;color:#fff}.danger{background:var(--danger);color:#fff}.blue{background:var(--blue);color:#06202b}.full{width:100%}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:12px}.hidden{display:none!important}
.nav{position:fixed;left:0;right:0;bottom:0;background:#08111e;border-top:1px solid #263449;display:flex;z-index:20}.nav button{flex:1;background:none;color:#cbd5e1;padding:12px 4px}.nav button.active{color:var(--accent)}
.tab{display:none}.tab.active{display:block}.listitem{padding:12px 0;border-bottom:1px solid #263449}.listitem:last-child{border-bottom:0}.big{font-size:19px}
.timerOverlay{position:fixed;inset:0;background:radial-gradient(circle at top,#15213b,#040814 60%,#000);z-index:9999;display:none;flex-direction:column;padding:16px}.timerOverlay.show{display:flex}
.time{font-size:clamp(78px,24vw,150px);font-weight:900;text-align:center;font-variant-numeric:tabular-nums}.center{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center}
.rep{font-size:54px;font-weight:900}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.status{padding:10px;border-radius:12px;background:#0b1220}.good{color:#4ade80}.warn{color:#facc15}
.small{font-size:12px}.code{font-family:monospace;word-break:break-all;background:#0b1220;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Kettlebell 220</h1>
    <div class="goal">CEL: 220 × 24 kg / 10:00 / 1 zmiana ręki</div>
    <div class="muted">Wersja Zawodnik + Trener</div>
  </div>

  <section id="authBox" class="card">
    <h2>Logowanie</h2>
    <div class="grid">
      <div><label>E-mail</label><input id="email" type="email"></div>
      <div><label>Hasło</label><input id="password" type="password"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ok" onclick="login()">ZALOGUJ</button>
      <button class="btn secondary" onclick="toggleRegister()">NOWE KONTO</button>
    </div>
    <div id="registerBox" class="hidden" style="margin-top:12px">
      <div class="grid">
        <div><label>Imię / nazwa</label><input id="displayName"></div>
        <div><label>Rola</label><select id="role"><option value="athlete">Zawodnik</option><option value="coach">Trener</option></select></div>
      </div>
      <button class="btn full" style="margin-top:10px" onclick="registerUser()">UTWÓRZ KONTO</button>
    </div>
    <div id="authMsg" class="muted" style="margin-top:10px"></div>
  </section>

  <section id="appBox" class="hidden">
    <div class="card">
      <div class="row">
        <div><b id="who"></b><div id="roleLabel" class="muted"></div></div>
        <button class="secondary" onclick="logout()">Wyloguj</button>
      </div>
    </div>

    <section id="athleteHome" class="tab active">
      <div class="card">
        <h2>Trening od trenera</h2>
        <div id="athleteWorkoutList"><div class="muted">Ładowanie...</div></div>
      </div>
      <div class="card">
        <h3>Twój ID zawodnika</h3>
        <div class="muted">Podaj go trenerowi tylko raz.</div>
        <div id="athleteId" class="code"></div>
      </div>
    </section>

    <section id="athleteHistory" class="tab">
      <div class="card"><h2>Historia wyników</h2><div id="historyList"></div></div>
    </section>

    <section id="coachAthletes" class="tab">
      <div class="card">
        <h2>Zawodnicy</h2>
        <label>ID zawodnika</label><input id="newAthleteId" placeholder="np. 123e4567-e89b-12d3-a456-426614174000">
        <button class="btn full" style="margin-top:10px" onclick="linkAthlete()">DODAJ ZAWODNIKA</button>
        <div id="coachMsg" class="muted" style="margin-top:8px"></div>
        <div id="athletesList" style="margin-top:10px"></div>
      </div>
    </section>

    <section id="coachPlan" class="tab">
      <div class="card">
        <h2>Ułóż trening</h2>
        <div class="grid">
          <div><label>Zawodnik</label><select id="coachAthleteSelect"></select></div>
          <div><label>Data</label><input id="scheduledFor" type="date"></div>
          <div><label>Nazwa</label><input id="wTitle" value="Snatch 24 kg"></div>
          <div><label>Ciężar kg</label><input id="wKg" type="number" value="24"></div>
          <div><label>Czas sek.</label><input id="wDuration" type="number" value="600"></div>
          <div><label>Cel powt.</label><input id="wTargetReps" type="number" value="190"></div>
          <div><label>Tempo / min</label><input id="wRpm" type="number" step="0.1" value="19"></div>
          <div><label>Serie</label><input id="wSets" type="number" value="1"></div>
          <div><label>Przerwa sek.</label><input id="wRest" type="number" value="0"></div>
        </div>
        <label>Zmiana ręki / zasada</label><input id="wSwitch" value="1 zmiana w połowie czasu">
        <label>Instrukcje / komentarz trenera</label><textarea id="wInstructions" rows="3" placeholder="np. nie przyspieszaj pierwszych 3 minut"></textarea>
        <button class="btn ok full" style="margin-top:10px" onclick="createWorkout()">ZAPISZ TRENING</button>
        <div id="planMsg" class="muted" style="margin-top:8px"></div>
      </div>
    </section>

    <section id="coachResults" class="tab">
      <div class="card"><h2>Wyniki zawodników</h2><div id="coachResultsList"></div></div>
    </section>
  </section>
</div>

<nav id="athleteNav" class="nav hidden">
  <button class="active" onclick="showTab('athleteHome',this)">TRENING</button>
  <button onclick="showTab('athleteHistory',this);loadHistory()">HISTORIA</button>
</nav>
<nav id="coachNav" class="nav hidden">
  <button class="active" onclick="showTab('coachAthletes',this);loadAthletes()">ZAWODNICY</button>
  <button onclick="showTab('coachPlan',this);loadAthletes()">PLAN</button>
  <button onclick="showTab('coachResults',this);loadCoachResults()">WYNIKI</button>
</nav>

<div id="timer" class="timerOverlay">
  <div class="row"><div><b id="timerTitle"></b><div id="timerMeta" class="muted"></div></div><button class="secondary" onclick="closeTimer()">✕</button></div>
  <div class="center">
    <div id="timerTime" class="time">10:00</div>
    <div class="row" style="width:100%;max-width:640px;align-items:center">
      <button class="secondary" onclick="changeReps(-1)">−1</button>
      <div id="repCount" class="rep" style="text-align:center">0</div>
      <button class="secondary" onclick="changeReps(1)">+1</button>
      <button class="secondary" onclick="changeReps(5)">+5</button>
    </div>
    <div class="row" style="width:100%;max-width:640px;margin-top:12px">
      <button id="timerStart" class="ok" onclick="toggleTimer()">START</button>
      <button class="danger" onclick="finishTimer()">ZAKOŃCZ</button>
    </div>
    <div id="saveResultBox" class="card hidden" style="width:100%;max-width:640px;margin-top:14px">
      <h3>Zapis wyniku</h3>
      <div class="grid">
        <div><label>RPE 1–10</label><input id="resultRpe" type="number" min="1" max="10" value="7"></div>
        <div><label>Ograniczenie</label><select id="resultLimiter"><option>brak</option><option>chwyt</option><option>oddech</option><option>przedramię</option><option>bark</option><option>technika</option></select></div>
        <div><label>Lewa</label><input id="resultLeft" type="number"></div>
        <div><label>Prawa</label><input id="resultRight" type="number"></div>
      </div>
      <label>Uwagi</label><textarea id="resultNotes" rows="2"></textarea>
      <button class="btn full" style="margin-top:10px" onclick="saveResult()">ZAPISZ I WYŚLIJ TRENEROWI</button>
    </div>
  </div>
</div>

<script>
const SB_URL='https://ogelfqdoilzohwhpjqug.supabase.co';
const SB_KEY='sb_publishable_XC3UGoOyuis0FcijJ63mZA_APSYkDFd';
let session=JSON.parse(localStorage.getItem('kb_session')||'null');
let profile=null, linkedAthletes=[], currentWorkout=null;
let timerInt=null, remaining=0, elapsed=0, reps=0, running=false;

function msg(id,t){document.getElementById(id).textContent=t||''}
function hdr(auth=true){const h={'apikey':SB_KEY,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization='Bearer '+session.access_token;return h}
async function api(path,opt={}){const r=await fetch(SB_URL+path,{...opt,headers:{...hdr(opt.auth!==false),...(opt.headers||{})}});const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.hint||txt||('HTTP '+r.status));return data}
function toggleRegister(){document.getElementById('registerBox').classList.toggle('hidden')}
async function registerUser(){try{msg('authMsg','Tworzę konto...');const body={email:email.value.trim(),password:password.value,data:{role:role.value,display_name:displayName.value.trim()||email.value.trim()}};const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify(body),auth:false});msg('authMsg',d?.session?'Konto utworzone. Loguję...':'Konto utworzone. Jeśli Supabase wymaga potwierdzenia e-mail, potwierdź wiadomość i zaloguj się.');if(d?.access_token){session=d;saveSession();await boot()}}catch(e){msg('authMsg','Błąd: '+e.message)}}
async function login(){try{msg('authMsg','Logowanie...');const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value}),auth:false});session=d;saveSession();await boot()}catch(e){msg('authMsg','Błąd: '+e.message)}}
function saveSession(){localStorage.setItem('kb_session',JSON.stringify(session))}
function logout(){localStorage.removeItem('kb_session');session=null;profile=null;location.reload()}
async function boot(){if(!session?.access_token)return;try{const u=session.user?.id;const p=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(u)+'&select=*');profile=p?.[0];if(!profile)throw new Error('Brak profilu');authBox.classList.add('hidden');appBox.classList.remove('hidden');who.textContent=profile.display_name||session.user?.email||'Użytkownik';roleLabel.textContent=profile.role==='coach'?'Trener':'Zawodnik';if(profile.role==='coach'){coachNav.classList.remove('hidden');athleteNav.classList.add('hidden');showTab('coachAthletes',coachNav.children[0]);await loadAthletes()}else{athleteNav.classList.remove('hidden');coachNav.classList.add('hidden');athleteId.textContent=session.user.id;showTab('athleteHome',athleteNav.children[0]);await loadAthleteWorkouts();await loadHistory()}}catch(e){msg('authMsg','Sesja wygasła: '+e.message);logout()}}
function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}

async function loadAthleteWorkouts(){try{const uid=session.user.id;const data=await api('/rest/v1/workouts?athlete_id=eq.'+uid+'&status=eq.planned&order=scheduled_for.asc&select=*');if(!data.length){athleteWorkoutList.innerHTML='<div class="muted">Brak zaplanowanych treningów od trenera.</div>';return}athleteWorkoutList.innerHTML=data.map(w=>`<div class="listitem"><div><b>${w.scheduled_for} • ${esc(w.title)}</b> <span class="badge">${w.kettlebell_kg||''} kg</span></div><div class="muted">${w.duration_seconds?Math.round(w.duration_seconds/60)+' min':''} ${w.target_rpm?'• '+w.target_rpm+'/min':''} ${w.target_reps?'• cel '+w.target_reps:''}</div><div>${esc(w.instructions||'')}</div><button class="btn ok full" style="margin-top:8px" onclick='startAssigned(${JSON.stringify(w)})'>START</button></div>`).join('')}catch(e){athleteWorkoutList.innerHTML='<div class="warn">Błąd: '+esc(e.message)+'</div>'}}
function startAssigned(w){currentWorkout=w;remaining=w.duration_seconds||600;elapsed=0;reps=0;running=false;timerTitle.textContent=w.title;timerMeta.textContent=`${w.kettlebell_kg||''} kg • cel ${w.target_reps||'-'} • ${w.target_rpm||'-'}/min`;repCount.textContent='0';saveResultBox.classList.add('hidden');timerStart.textContent='START';updateTimer();timer.classList.add('show')}
function closeTimer(){if(timerInt)clearInterval(timerInt);timerInt=null;running=false;timer.classList.remove('show')}
function updateTimer(){const m=Math.floor(remaining/60),s=remaining%60;timerTime.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function toggleTimer(){if(running){clearInterval(timerInt);timerInt=null;running=false;timerStart.textContent='WZNÓW'}else{running=true;timerStart.textContent='PAUZA';timerInt=setInterval(()=>{if(remaining>0){remaining--;elapsed++;updateTimer()}else finishTimer()},1000)}}
function changeReps(x){reps=Math.max(0,reps+x);repCount.textContent=reps}
function finishTimer(){if(timerInt)clearInterval(timerInt);timerInt=null;running=false;saveResultBox.classList.remove('hidden');resultLeft.value=Math.floor(reps/2);resultRight.value=reps-Math.floor(reps/2)}
async function saveResult(){try{const body={workout_id:currentWorkout.id,athlete_id:session.user.id,reps:reps,duration_seconds:elapsed,left_reps:+resultLeft.value||null,right_reps:+resultRight.value||null,rpe:+resultRpe.value||null,limiter:resultLimiter.value,notes:resultNotes.value.trim()};await api('/rest/v1/workout_results',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});closeTimer();await loadAthleteWorkouts();await loadHistory();alert('Wynik wysłany trenerowi.')}catch(e){alert('Błąd zapisu: '+e.message)}}
async function loadHistory(){if(profile?.role!=='athlete')return;try{const d=await api('/rest/v1/workout_results?athlete_id=eq.'+session.user.id+'&order=completed_at.desc&limit=30&select=*');historyList.innerHTML=d.length?d.map(r=>`<div class="listitem"><b>${new Date(r.completed_at).toLocaleDateString()}</b> • ${r.reps||0} powt. • RPE ${r.rpe??'-'}<div class="muted">${r.duration_seconds?Math.round(r.duration_seconds/60*10)/10+' min':''} ${esc(r.limiter||'')}</div><div>${esc(r.notes||'')}</div></div>`).join(''):'<div class="muted">Brak wyników.</div>'}catch(e){historyList.innerHTML='<div class="warn">'+esc(e.message)+'</div>'}}

async function linkAthlete(){try{const athlete=newAthleteId.value.trim();if(!athlete)throw new Error('Wpisz ID zawodnika');await api('/rest/v1/coach_athletes',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({coach_id:session.user.id,athlete_id:athlete})});msg('coachMsg','Zawodnik dodany.');newAthleteId.value='';await loadAthletes()}catch(e){msg('coachMsg','Błąd: '+e.message)}}
async function loadAthletes(){if(profile?.role!=='coach')return;try{const links=await api('/rest/v1/coach_athletes?coach_id=eq.'+session.user.id+'&select=athlete_id');linkedAthletes=[];for(const l of links){let name=l.athlete_id;try{const p=await api('/rest/v1/profiles?id=eq.'+l.athlete_id+'&select=id,display_name,email');if(p?.[0])name=p[0].display_name||p[0].email||name}catch{}linkedAthletes.push({id:l.athlete_id,name})}athletesList.innerHTML=linkedAthletes.length?linkedAthletes.map(a=>`<div class="listitem"><b>${esc(a.name)}</b><div class="small code">${a.id}</div></div>`).join(''):'<div class="muted">Brak zawodników.</div>';coachAthleteSelect.innerHTML=linkedAthletes.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');if(!scheduledFor.value)scheduledFor.value=new Date().toISOString().slice(0,10)}catch(e){athletesList.innerHTML='<div class="warn">Błąd: '+esc(e.message)+'</div>'}}
async function createWorkout(){try{const athlete=coachAthleteSelect.value;if(!athlete)throw new Error('Najpierw dodaj zawodnika');const body={athlete_id:athlete,coach_id:session.user.id,scheduled_for:scheduledFor.value,title:wTitle.value.trim()||'Trening',kettlebell_kg:+wKg.value||null,duration_seconds:+wDuration.value||null,target_reps:+wTargetReps.value||null,sets:+wSets.value||1,rest_seconds:+wRest.value||0,target_rpm:+wRpm.value||null,hand_switch_rule:wSwitch.value.trim(),instructions:wInstructions.value.trim(),status:'planned'};await api('/rest/v1/workouts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});msg('planMsg','Trening zapisany i dostępny u zawodnika.')}catch(e){msg('planMsg','Błąd: '+e.message)}}
async function loadCoachResults(){try{if(!linkedAthletes.length)await loadAthletes();let out=[];for(const a of linkedAthletes){try{const r=await api('/rest/v1/workout_results?athlete_id=eq.'+a.id+'&order=completed_at.desc&limit=10&select=*');r.forEach(x=>out.push({...x,athleteName:a.name}))}catch{}}out.sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at));coachResultsList.innerHTML=out.length?out.map(r=>`<div class="listitem"><b>${esc(r.athleteName)}</b> • ${new Date(r.completed_at).toLocaleDateString()}<div>${r.reps||0} powt. • RPE ${r.rpe??'-'} • ${esc(r.limiter||'')}</div><div class="muted">${esc(r.notes||'')}</div></div>`).join(''):'<div class="muted">Brak wyników.</div>'}catch(e){coachResultsList.innerHTML='<div class="warn">'+esc(e.message)+'</div>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(session?.access_token)boot();
</script>
</body>
</html>
